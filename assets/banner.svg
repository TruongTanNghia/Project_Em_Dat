<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Medical AI Suite - Sau pipeline AI y khoa tren mot phong doc duy nhat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCF6EC"/><stop offset="55%" stop-color="#F7EEDF"/><stop offset="100%" stop-color="#F3E3CC"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F28C1B"/><stop offset="50%" stop-color="#FFB547"/><stop offset="100%" stop-color="#F28C1B"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3BB8C3"/><stop offset="100%" stop-color="#1E8FA8"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0E4A63" opacity="0.10"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#dots)"/>
  <circle cx="950" cy="186" r="140" fill="#3BB8C3" opacity="0.16" filter="url(#soft)">
    <animate attributeName="r" values="140;158;140" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- NHAN -->
  <g transform="translate(70,74)">
    <rect x="0" y="-18" width="11" height="24" rx="3" fill="url(#ink)"/>
    <text x="24" y="0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#1E8FA8">ADA GROUP · MEDICAL AI RESEARCH</text>
  </g>

  <!-- TEN DU AN -->
  <g transform="translate(70,160)">
    <text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-1">
      <tspan fill="#0E4A63">MEDICAL</tspan><tspan fill="#F28C1B" dx="16">AI SUITE</tspan>
    </text>
    <rect x="0" y="22" height="7" rx="3.5" fill="url(#ink)">
      <animate attributeName="width" values="0;330;330" dur="2.6s" fill="freeze"/>
    </rect>
  </g>

  <text x="70" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#0E4A63" opacity="0.88">Sáu pipeline AI y khoa trên một phòng đọc duy nhất</text>

  <!-- CHIP CONG NGHE -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700">
    <g transform="translate(70,278)"><rect width="112" height="34" rx="17" fill="#0E4A63"/><text x="56" y="22" fill="#FCF6EC" text-anchor="middle">Next.js 16</text></g>
    <g transform="translate(194,278)"><rect width="82" height="34" rx="17" fill="url(#teal)"/><text x="41" y="22" fill="#FCF6EC" text-anchor="middle">Flask</text></g>
    <g transform="translate(288,278)"><rect width="100" height="34" rx="17" fill="#F28C1B"/><text x="50" y="22" fill="#FCF6EC" text-anchor="middle">PyTorch</text></g>
    <g transform="translate(400,278)"><rect width="124" height="34" rx="17" fill="none" stroke="#0E4A63" stroke-width="2"/><text x="62" y="22" fill="#0E4A63" text-anchor="middle">TensorFlow</text></g>
  </g>

  <!-- NODE QUAY QUANH -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 950 186" to="360 950 186" dur="26s" repeatCount="indefinite"/>
    <circle cx="950" cy="48" r="8" fill="#3BB8C3"/>
    <circle cx="1088" cy="186" r="6" fill="#F28C1B"/>
    <circle cx="950" cy="324" r="7" fill="#0E4A63"/>
    <circle cx="812" cy="186" r="5" fill="#1E8FA8"/>
  </g>

  <!-- MINH HOA: MAN HINH EEG -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="5s" repeatCount="indefinite"/>
    <rect x="792" y="86" width="316" height="200" rx="14" fill="#FFFDF8" stroke="#0E4A63" stroke-width="2.5"/>
    <rect x="792" y="86" width="316" height="40" rx="14" fill="#0E4A63"/>
    <rect x="792" y="112" width="316" height="14" fill="#0E4A63"/>
    <circle cx="812" cy="106" r="5" fill="#F28C1B"/><circle cx="828" cy="106" r="5" fill="#3BB8C3"/>
    <text x="1090" y="111" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#FCF6EC">EEG · 256 Hz</text>
    <g stroke="#0E4A63" stroke-width="1" opacity="0.10">
      <line x1="814" y1="184" x2="1086" y2="184"/><line x1="814" y1="225" x2="1086" y2="225"/>
    </g>
    <!-- cua so bat thuong -->
    <rect x="962" y="220" width="88" height="52" rx="8" fill="#F28C1B" opacity="0.14">
      <animate attributeName="opacity" values="0.08;0.26;0.08" dur="2.4s" repeatCount="indefinite"/>
    </rect>
