    <path d="M814 209.6 L820 209.1 L826 199.6 L832 202.3 L838 207.1 L844 201.8 L850 201.6 L856 208.9 L862 201.8 L868 200.1 L874 208.4 L880 205.1 L886 198.3 L892 204.4 L898 207.1 L904 202.7 L910 204.0 L916 208.6 L922 204.5 L928 201.0 L934 206.9 L940 206.2 L946 201.2 L952 207.5 L958 207.2 L964 201.4 L970 203.5 L976 207.3 L982 200.3 L988 199.1 L994 208.4 L1000 201.6 L1006 202.0 L1012 205.3 L1018 204.7 L1024 199.3 L1030 207.1 L1036 206.4 L1042 201.9 L1048 199.9 L1054 206.2 L1060 205.5 L1066 201.0 L1072 204.6 L1078 207.7 L1084 199.6" fill="none" stroke="#3BB8C3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.62;0.94;1" dur="6s" begin="0.5s" repeatCount="indefinite"/></path>
    <path d="M814 246.6 L820 246.3 L826 240.6 L832 245.7 L838 250.4 L844 242.1 L850 243.8 L856 251.0 L862 241.6 L868 240.5 L874 247.6 L880 246.4 L886 240.6 L892 247.7 L898 248.3 L904 243.5 L910 245.7 L916 250.7 L922 247.5 L928 242.2 L934 251.4 L940 249.4 L946 241.3 L952 249.7 L958 250.3 L964 241.6 L970 233.0 L976 258.8 L982 230.5 L988 263.0 L994 231.1 L1000 260.8 L1006 232.0 L1012 260.6 L1018 233.2 L1024 259.0 L1030 231.9 L1036 258.9 L1042 229.4 L1048 242.4 L1054 250.3 L1060 244.5 L1066 241.1 L1072 248.5 L1078 248.0 L1084 243.1" fill="none" stroke="#F28C1B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.62;0.94;1" dur="6s" begin="1.0s" repeatCount="indefinite"/></path>
  </g>

  <!-- MINH HOA: LAT CAT NAO + DIEM U -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,6; 0,0" dur="6s" repeatCount="indefinite"/>
    <circle cx="806" cy="272" r="48" fill="#FFFDF8" stroke="#0E4A63" stroke-width="2.5"/>
    <path d="M806 236 C 782 236, 770 256, 776 274 C 772 292, 788 308, 806 306 Z" fill="none" stroke="#1E8FA8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M806 236 C 830 236, 842 256, 836 274 C 840 292, 824 308, 806 306 Z" fill="none" stroke="#1E8FA8" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M788 258 q8 6 0 14 M792 284 q8 -4 10 6 M822 256 q-8 8 2 14" fill="none" stroke="#3BB8C3" stroke-width="2" stroke-linecap="round"/>
    <circle cx="822" cy="286" r="7" fill="#F28C1B"/>
    <circle cx="822" cy="286" r="7" fill="none" stroke="#F28C1B" stroke-width="2">
      <animate attributeName="r" values="7;20" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="1130" y="356" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#0E4A63" opacity="0.62">© Trương Tấn Nghĩa · AI Học Lập Trình</text>
</svg>
