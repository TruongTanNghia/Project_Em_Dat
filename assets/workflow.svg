<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Luong xu ly mot ca: tai du lieu, Next.js, ngrok, Flask API, mo hinh AI, ket qua">
  <defs>
